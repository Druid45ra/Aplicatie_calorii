name: aplicatie_calorii
description: Offline-first calorie tracking app built with Flutter Clean Architecture.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5
  go_router: ^14.2.7
  get_it: ^7.7.0
  intl: ^0.19.0
  uuid: ^4.4.2
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  fl_chart: ^1.2.0
  path_provider: ^2.1.4
  file_picker: ^10.3.2
  share_plus: ^11.1.0
  equatable: ^2.0.5
  collection: ^1.18.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.0
  riverpod_generator: ^2.3.10

flutter:
  uses-material-design: true
